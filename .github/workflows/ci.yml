name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─── Build & Test: React Client ───────────────────────────────────────────
  client:
    name: Client (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6           # ✅ Node.js 24 native

      - name: Set up Node.js
        uses: actions/setup-node@v7         # ✅ Node.js 24 native
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          CI: false                         # Prevents warnings from failing the build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3   # ✅ Node.js 24 native
        with:
          path: client/build/

  # ─── Deploy to GitHub Pages ────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: client                           # Wait for build to succeed
    if: github.ref == 'refs/heads/main'     # Only deploy on pushes to main

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4       # ✅ Node.js 24 native

  # ─── Lint & Validate: Express Backend ─────────────────────────────────────
  backend:
    name: Backend (Express)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6           # ✅ Node.js 24 native

      - name: Set up Node.js
        uses: actions/setup-node@v7         # ✅ Node.js 24 native
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        env:
          CI: true
